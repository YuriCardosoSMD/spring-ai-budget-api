spring.application.name=spring-ai-budget-api

# ===================================================================
# CONFIGURAÇÃO DO BANCO DE DADOS (H2 ativo por padrão para facilitar testes)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:budgetdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Para usar o PostgreSQL do docker-compose.yml, basta comentar o bloco H2 acima e descomentar abaixo:
# spring.datasource.url=jdbc:postgresql://localhost:5432/budget_db
# spring.datasource.username=postgres
# spring.datasource.password=postgrespassword
# spring.jpa.hibernate.ddl-auto=update

# ===================================================================
# CONFIGURAÇÃO DO SPRING AI (LLM, Transcrição de Áudio e Voz)
# ===================================================================
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-chave-de-teste-configure-sua-variavel}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.transcription.options.language=pt
spring.ai.openai.audio.speech.options.model=tts-1
spring.ai.openai.audio.speech.options.voice=alloy

# Limite de upload para arquivos de áudio
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB